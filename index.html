<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PinLog</title>
<meta name="description" content="A private log for TRT: doses, schedules, injection sites, supply, body metrics and bloodwork. Everything stays on your device.">
<meta name="theme-color" content="#EEF1EF">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PinLog">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --ground:#EEF1EF; --surface:#FFFFFF; --surface-2:#F3F6F4; --ink:#15201B; --ink-2:#3B4843; --muted:#5C6B64;
  --line:#D6DEDA; --line-2:#E6ECE9;
  --accent:#0A7A5D; --accent-press:#08664E; --accent-ink:#FFFFFF; --accent-soft:#DCEFE7;
  --warn:#B23F0E; --warn-soft:#FBE8DD; --amber:#9A6200; --amber-soft:#F7ECD2;
  --figure:#D6DED9; --figure-line:#B8C4BE; --toast-action:#8EE6C6;
  --c0:#2a78d6; --c1:#eb6834; --c2:#1baf7a; --c3:#eda100; --c4:#e87ba4; --c5:#008300; --c6:#6250d6; --c7:#e34948;
  --r:16px;
  --shadow:0 1px 2px rgba(21,32,27,.05),0 10px 28px -16px rgba(21,32,27,.28);
  --font:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --font-c:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --ground:#0F1513; --surface:#18201D; --surface-2:#1F2925; --ink:#E4EBE8; --ink-2:#C1CCC7; --muted:#93A29B;
    --line:#2D3934; --line-2:#24302B;
    --accent:#3CC096; --accent-press:#5AD3AB; --accent-ink:#04241A; --accent-soft:#16392E;
    --warn:#F08A5D; --warn-soft:#3B2318; --amber:#E2B252; --amber-soft:#342A19;
    --figure:#2A3632; --figure-line:#3D4C46; --toast-action:#08664E;
    --c0:#3987e5; --c1:#d95926; --c2:#199e70; --c3:#c98500; --c4:#d55181; --c5:#2f9a2f; --c6:#9085e9; --c7:#e66767;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 32px -16px rgba(0,0,0,.7);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ground:#0F1513; --surface:#18201D; --surface-2:#1F2925; --ink:#E4EBE8; --ink-2:#C1CCC7; --muted:#93A29B;
  --line:#2D3934; --line-2:#24302B;
  --accent:#3CC096; --accent-press:#5AD3AB; --accent-ink:#04241A; --accent-soft:#16392E;
  --warn:#F08A5D; --warn-soft:#3B2318; --amber:#E2B252; --amber-soft:#342A19;
  --figure:#2A3632; --figure-line:#3D4C46; --toast-action:#08664E;
  --c0:#3987e5; --c1:#d95926; --c2:#199e70; --c3:#c98500; --c4:#d55181; --c5:#2f9a2f; --c6:#9085e9; --c7:#e66767;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 14px 32px -16px rgba(0,0,0,.7);
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font:400 16px/1.5 var(--font);-webkit-font-smoothing:antialiased}
body.locked{overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
h1{font:600 30px/1.12 var(--font-c);letter-spacing:-.01em}
.h2{font:600 18px/1.3 var(--font)}
.muted{color:var(--muted)}
.small{font-size:14px}
.hint{color:var(--muted);font-size:13.5px;font-weight:400}
.strong{font-weight:600}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

/* ---------- shell ---------- */
.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh;min-height:100dvh}
.rail{display:none}
.topbar{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;padding-top:calc(12px + env(safe-area-inset-top));background:color-mix(in srgb,var(--ground) 90%,transparent);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.brand{display:inline-flex;align-items:center;gap:10px;font:700 20px/1 var(--font-c);color:var(--ink);text-decoration:none;letter-spacing:-.01em}
main{width:100%;max-width:1080px;margin:0 auto;padding:8px 16px calc(150px + env(safe-area-inset-bottom))}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;display:grid;grid-template-columns:repeat(5,1fr);background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 8px;font-size:11.5px;font-weight:500;color:var(--muted);text-decoration:none}
.tabbar a[aria-current="page"]{color:var(--accent)}
.fab{display:none;position:fixed;z-index:31;right:16px;bottom:calc(78px + env(safe-area-inset-bottom));align-items:center;gap:8px;height:52px;padding:0 20px 0 16px;border-radius:26px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:600;font-size:16px;box-shadow:var(--shadow);cursor:pointer}
@media (max-width:899px){body[data-fab="1"] .fab{display:inline-flex}}
@media (min-width:900px){
  .app{grid-template-columns:232px minmax(0,1fr)}
  .topbar,.tabbar{display:none}
  .rail{display:flex;flex-direction:column;gap:24px;position:sticky;top:0;height:100vh;height:100dvh;padding:28px 16px 22px;border-right:1px solid var(--line);background:var(--surface)}
  main{padding:40px 44px 90px}
  h1{font-size:34px}
}
.rail nav{display:flex;flex-direction:column;gap:2px}
.rail nav a{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:var(--ink-2);text-decoration:none;font-weight:500}
.rail nav a:hover{background:var(--surface-2)}
.rail nav a[aria-current="page"]{background:var(--accent-soft);color:var(--ink)}
.rail nav a[aria-current="page"] svg{color:var(--accent)}
.rail-foot{margin-top:auto;font-size:13px;color:var(--muted);line-height:1.55}
kbd{font:600 12px var(--font);padding:1px 6px;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;background:var(--surface-2)}

/* ---------- buttons ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:22px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:15px;line-height:1.1;cursor:pointer;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-press);border-color:var(--accent-press)}
.btn.ghost{background:transparent;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--surface-2)}
.btn.danger{color:var(--warn);border-color:transparent;background:transparent}
.btn.danger:hover{background:var(--warn-soft)}
.btn.danger-solid{background:var(--warn);border-color:var(--warn);color:#fff}
.btn.sm{min-height:36px;padding:0 14px;font-size:14px;border-radius:18px}
.btn.lg{min-height:52px;padding:0 24px;font-size:16px;border-radius:26px}
.btn.xl{min-height:58px;padding:0 26px;font-size:17px;border-radius:29px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;pointer-events:none}
.link{background:none;border:0;padding:0;color:var(--accent);font-weight:600;cursor:pointer;text-decoration:underline;text-underline-offset:3px;font-size:inherit}
.icon-btn{flex:none;width:42px;height:42px;display:inline-grid;place-items:center;border-radius:21px;border:0;background:transparent;color:var(--ink-2);cursor:pointer;text-decoration:none}
.icon-btn:hover{background:var(--surface-2)}
.icon-btn.sm{width:36px;height:36px;border-radius:18px}

/* ---------- generic ---------- */
.page-head{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:14px;margin:10px 0 20px}
.page-head p{margin-top:6px;max-width:60ch}
.block{margin-top:30px}
.block-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:10px}
.back{display:inline-flex;align-items:center;gap:2px;color:var(--ink-2);text-decoration:none;font-weight:500;font-size:15px;margin:6px 0 4px -6px;padding:6px}
.banner{padding:12px 16px;border-radius:12px;background:var(--warn-soft);color:var(--warn);margin-bottom:18px;font-weight:500}
.empty{padding:30px 22px;text-align:center;background:var(--surface);border:1px dashed var(--line);border-radius:var(--r)}
.empty p{max-width:44ch;margin:0 auto 16px;color:var(--muted)}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-top:14px}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.sec-head h2{font:600 16px/1.3 var(--font);color:var(--ink-2)}
.big{font:600 34px/1.1 var(--font-c)}
.big small{font:500 15px var(--font);color:var(--muted);margin-left:4px}
.sec-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.note{padding:12px 14px;border-radius:12px;background:var(--surface-2);font-size:14px;color:var(--ink-2);margin-top:14px}
.note-amber{color:var(--amber);font-size:14px;font-weight:600;margin-top:6px;display:block}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:999px;font-size:13.5px;font-weight:600;background:var(--surface-2);color:var(--ink-2);white-space:nowrap}
.chip.ok{background:var(--accent-soft);color:var(--accent)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.amber{background:var(--amber-soft);color:var(--amber)}
.cap{--s:18px;display:inline-block;flex:none;width:var(--s);height:var(--s);border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--cap) 50%,var(--surface)) 0 30%,var(--cap) 34%);box-shadow:0 0 0 1px color-mix(in srgb,var(--cap) 70%,#000)}
.cap.sm{--s:12px}
.cap.lg{--s:30px}
.cap.xl{--s:40px}
.bar{height:8px;border-radius:4px;background:var(--line-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:4px;background:var(--cap,var(--accent))}
.rows{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.rows>li{display:flex;align-items:center;gap:14px;padding:13px 16px;border-top:1px solid var(--line-2)}
.rows>li:first-child{border-top:0}
.row-main{flex:1;min-width:0}
.row-title{font-weight:600}
.row-sub{font-size:14px;color:var(--muted);margin-top:1px}
.row-note{font-size:14px;color:var(--ink-2);margin-top:4px;white-space:pre-wrap}
.rows>li.entry-li{padding:0}
.entry{display:flex;align-items:center;gap:14px;width:100%;padding:13px 16px;border:0;background:none;text-align:left;cursor:pointer;border-radius:var(--r);color:inherit}
.entry:hover{background:var(--surface-2)}
.entry-side{flex:none;font-size:14px;color:var(--ink-2);display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.seg{display:inline-flex;flex-wrap:wrap;gap:6px}
.seg button{min-height:40px;padding:0 15px;border-radius:20px;border:1px solid var(--line);background:var(--surface);font-weight:500;font-size:14.5px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.seg button:hover{border-color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.seg.sm button{min-height:32px;padding:0 12px;font-size:13.5px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{min-height:42px;padding:0 15px;border-radius:21px;border:1px solid var(--line);background:var(--surface);font-size:15px;font-weight:500;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.chips button small{color:var(--muted);font-size:12.5px}
.chips button[aria-pressed="true"]{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chips button[aria-pressed="true"] small{color:inherit;opacity:.75}
.chips button.more{border-style:dashed;color:var(--ink-2)}

/* ---------- today ---------- */
.today-head{display:flex;align-items:center;justify-content:space-between;gap:16px;margin:10px 0 20px}
.date-line{font-size:15px;color:var(--muted);margin-bottom:2px}
.pring{position:relative;width:72px;height:72px;flex:none}
.pring svg{display:block}
.ring-bg{fill:none;stroke:var(--line);stroke-width:7}
.ring-fg{fill:none;stroke:var(--accent);stroke-width:7;stroke-linecap:round}
.pring>span{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05;font-size:12px;color:var(--muted)}
.pring b{font:600 21px var(--font-c);color:var(--ink)}
.today-grid{display:grid;gap:30px}
@media (min-width:1000px){.today-grid{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:40px;align-items:start}}
.next{position:relative;background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:20px 20px 20px 26px;box-shadow:var(--shadow);overflow:hidden}
.next::before{content:"";position:absolute;left:0;top:0;bottom:0;width:7px;background:var(--cap)}
.next h2{font:600 24px/1.15 var(--font-c);margin-top:12px}
.next-dose{font:600 46px/1 var(--font-c);margin-top:8px}
.next-dose small{font:500 18px var(--font);color:var(--muted);margin-left:5px}
.next-how{margin-top:14px;font-size:16px}
.next-viz{margin-top:6px;max-width:360px}
.next-site{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:12px;font-size:16px}
.next-site svg{color:var(--muted)}
.next-acts{display:flex;gap:8px;margin-top:20px;align-items:center}
.next-acts .btn.primary{flex:1}
.next.calm{padding:22px}
.next.calm::before{background:var(--accent)}
.next.calm h2{margin-top:10px}
.done-icon{width:52px;height:52px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.checks{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.check{display:flex;align-items:center;gap:12px;padding:10px 16px 10px 12px;border-top:1px solid var(--line-2)}
.check:first-child{border-top:0}
.tick{flex:none;width:42px;height:42px;border-radius:50%;border:2.5px solid var(--cap);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--accent-ink);padding:0}
.tick:hover{background:color-mix(in srgb,var(--cap) 14%,var(--surface))}
.tick.on{background:var(--accent);border-color:var(--accent)}
.tick.skip{border-color:var(--line);border-style:dashed;color:var(--muted)}
.check-main{flex:1;min-width:0;background:none;border:0;padding:4px 0;text-align:left;cursor:pointer;color:inherit}
.check-name{display:block;font-weight:600;font-size:16px}
.check-sub{display:block;font-size:14px;color:var(--muted);margin-top:1px}
.check.overdue .check-sub{color:var(--warn);font-weight:600}
.check.taken .check-name,.check.skipped .check-name{color:var(--muted)}
.check.skipped .check-name{text-decoration:line-through}
.check-dose{flex:none;font-weight:600;color:var(--ink-2)}
.check.taken .check-dose,.check.skipped .check-dose{color:var(--muted);font-weight:500}
.week{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.week button{width:100%;display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 2px 11px;border-radius:14px;background:var(--surface);border:1px solid var(--line-2);min-height:88px;cursor:pointer;color:inherit}
.week button:hover{border-color:var(--muted)}
.week .is-today button{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.week .wd{font-size:12.5px;color:var(--muted)}
.week .dn{font:600 19px/1.1 var(--font-c)}
.dots{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;margin-top:6px;max-width:100%}
.dot{flex:none;display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--cap)}
.dot.ring2{background:transparent;box-shadow:inset 0 0 0 2px var(--cap)}
.dot.skip{background:linear-gradient(135deg,transparent 42%,var(--cap) 42% 58%,transparent 58%);box-shadow:inset 0 0 0 1.5px var(--cap)}
.key{display:flex;flex-wrap:wrap;gap:6px 16px;margin-top:8px;font-size:13px;color:var(--muted)}
.key span{display:inline-flex;align-items:center;gap:6px}
.key .dot{--cap:var(--ink-2)}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:2px;padding:14px 16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);text-decoration:none;color:inherit;text-align:left;cursor:pointer;font:inherit;min-height:112px}
.tile:hover{border-color:var(--muted)}
.tile-label{font-size:14px;color:var(--muted);font-weight:500}
.tile-num{font:600 32px/1.1 var(--font-c);margin-top:auto}
.tile-num small{font:500 14px var(--font);color:var(--muted);margin-left:4px}
.tile-sub{font-size:13.5px;color:var(--ink-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile.warn{border-color:color-mix(in srgb,var(--warn) 45%,var(--line));background:var(--warn-soft)}
.tile.warn .tile-num,.tile.warn .tile-label{color:var(--warn)}
.tile.add .tile-num{color:var(--accent)}
.side-note{margin-top:12px;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:14px;display:flex;align-items:center;gap:12px;justify-content:space-between}

/* ---------- compounds ---------- */
.meds{display:grid;gap:10px}
.med{display:flex;align-items:center;gap:14px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);text-decoration:none;color:inherit}
.med:hover{border-color:var(--muted)}
.med-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.med-name{font:600 19px/1.25 var(--font-c)}
.med-line{font-size:15px;color:var(--ink-2)}
.med-next{font-size:14px;color:var(--muted)}
.med-supply{flex:none;width:130px;display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.med-supply.low{color:var(--warn);font-weight:600}
.med .chev{flex:none;color:var(--muted)}
@media (max-width:560px){.med{flex-wrap:wrap}.med .chev{order:2}.med-supply{order:3;width:100%;padding-left:44px}}
.med-head{display:flex;align-items:center;gap:14px;margin-top:6px}
.med-head h1{font-size:28px}
.med-sum{font-size:17px;color:var(--ink-2);margin-top:10px}
.med-acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.sched-item+.sched-item{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.sched-line{font-weight:600}
.tsteps{list-style:none;margin:12px 0 0 6px;padding:0 0 0 16px;border-left:2px solid var(--line);display:grid;gap:7px}
.tsteps li{position:relative;font-size:14.5px;color:var(--muted)}
.tsteps li::before{content:"";position:absolute;left:-23px;top:5px;width:12px;height:12px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 2px var(--line)}
.tsteps li.now{color:var(--ink)}
.tsteps li.now::before{background:var(--cap);box-shadow:none}
.tsteps b{font-weight:600;color:inherit}
.vial-list{list-style:none;margin:10px 0 0;padding:0}
.vial{padding:12px 0;border-top:1px solid var(--line-2)}
.vial-top{display:flex;justify-content:space-between;gap:10px;align-items:baseline;flex-wrap:wrap;margin-bottom:8px}
.vial-acts{display:flex;gap:4px;flex-wrap:wrap;margin-top:8px}
.kv{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 20px;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;font-weight:500}
details.fold{margin-top:12px}
details.fold>summary{cursor:pointer;font-weight:600;color:var(--ink-2);padding:6px 0;list-style:none;display:flex;align-items:center;gap:6px}
details.fold>summary::-webkit-details-marker{display:none}
details.fold>summary::before{content:"";width:8px;height:8px;border-right:2px solid currentColor;border-bottom:2px solid currentColor;transform:rotate(-45deg);transition:transform .15s;margin-right:4px}
details.fold[open]>summary::before{transform:rotate(45deg)}

/* ---------- calendar ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;margin-bottom:16px}
.daygroup{margin-top:20px}
.daygroup:first-child{margin-top:0}
.daygroup>h2{font:600 14px/1.3 var(--font);color:var(--muted);margin:0 0 8px 4px}
.cal-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.cal-head h2{font:600 21px/1.2 var(--font-c)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .wdh{font-size:12.5px;color:var(--muted);text-align:center;padding:2px 0 4px}
.cal .day{min-height:60px;display:flex;flex-direction:column;align-items:flex-start;gap:4px;padding:7px;border-radius:10px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;text-align:left}
.cal .day:hover{border-color:var(--muted)}
.cal .day.out{opacity:.38}
.cal .day.today{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cal .day.sel{box-shadow:inset 0 0 0 2px var(--ink)}
.cal .day .n{font-size:13.5px;font-weight:600}
.cal .dots{justify-content:flex-start;margin-top:0;gap:3px}
.cal .dot{width:8px;height:8px}
@media (min-width:700px){.cal .day{min-height:80px}.cal .dot{width:10px;height:10px}}

/* ---------- progress ---------- */
.prog-grid{display:grid;gap:14px}
@media (min-width:1000px){.prog-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}.prog-grid .wide{grid-column:1/-1}}
.prog-grid .sec{margin-top:0}
.mini-bars{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:10px}
.mini-bars li{display:grid;grid-template-columns:auto minmax(0,1fr) 80px 44px;gap:10px;align-items:center;font-size:14.5px}
.mini-bars .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-bars .pc{text-align:right;font-weight:600}
.lab-mini{list-style:none;margin:8px 0 0;padding:0}
.lab-mini li{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:1px solid var(--line-2)}
.lab-mini li:first-child{border-top:0}
.lab-mini b{font:600 18px var(--font-c)}
.line-key{display:inline-block;width:16px;height:3px;border-radius:2px;flex:none}
.rows.flat{border:0;background:transparent;margin:0 -16px}
.page-narrow{max-width:780px}
.lab-mini small{color:var(--muted);margin-left:4px}
.chart{position:relative;width:100%;margin-top:6px}
.chart svg{display:block;overflow:visible;touch-action:pan-y}
.chart .grid{stroke:var(--line-2);stroke-width:1}
.chart text{font:500 11px var(--font);fill:var(--muted)}
.chart .ln{fill:none;stroke-width:2.2;stroke-linejoin:round;stroke-linecap:round}
.chart .ln.dash{stroke-dasharray:5 4;opacity:.8}
.chart .pt{stroke:var(--surface);stroke-width:2}
.chart .goal{stroke:var(--ink-2);stroke-width:1.5;stroke-dasharray:6 4}
.chart .nowl{stroke:var(--ink-2);stroke-width:1.2;stroke-dasharray:3 3}
.chart .xh{stroke:var(--muted);stroke-width:1}
.chart .hit{fill:transparent;cursor:crosshair}
.chart .hlp{stroke:var(--surface);stroke-width:2}
.chart-tip{position:absolute;top:6px;pointer-events:none;background:var(--surface);border:1px solid var(--line);box-shadow:var(--shadow);border-radius:10px;padding:8px 10px;font-size:13px;line-height:1.45;min-width:140px;z-index:3;color:var(--ink)}
.chart-tip b{display:block;font-weight:600;margin-bottom:2px}
.chart-tip .r{display:flex;align-items:center;gap:6px;white-space:nowrap}
.chart-tip .r i{width:9px;height:9px;border-radius:50%;flex:none}
.chart-empty{display:grid;place-items:center;height:100%;color:var(--muted);font-size:14px;text-align:center;padding:16px;border:1px dashed var(--line);border-radius:10px}
.chart-legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13.5px;color:var(--ink-2);margin-top:8px}
.chart-legend span{display:inline-flex;align-items:center;gap:6px}
.chart-legend i{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--cap)}
.chart-legend i.line{width:16px;height:3px;border-radius:2px}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line-2)}
.stat b{display:block;font:600 20px/1.15 var(--font-c)}
.stat span{font-size:12.5px;color:var(--muted)}
@media (max-width:480px){.stats{grid-template-columns:repeat(2,minmax(0,1fr))}}
.rows>li.trend{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;align-items:center}
@media (min-width:600px){.rows>li.trend{grid-template-columns:minmax(0,1.2fr) minmax(110px,auto) 140px}}
.trend .val{font:600 22px/1.1 var(--font-c);text-align:right}
.trend .val small{font:500 13px var(--font);color:var(--muted);margin-left:4px}
.trend .sp{grid-column:1/-1}
@media (min-width:600px){.trend .sp{grid-column:auto}}
.spark{display:block;overflow:visible}
.spark .sl{fill:none;stroke:var(--ink-2);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.spark .pt{fill:var(--surface);stroke:var(--ink-2);stroke-width:1.5}
.spark .pt.last{fill:var(--ink);stroke:var(--surface);stroke-width:2}
.spark .hitpt{fill:transparent}
.labgrid{display:grid;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.labrow{display:grid;grid-template-columns:minmax(0,1fr) 110px 86px;gap:10px;align-items:center;padding:8px 12px;border-top:1px solid var(--line-2);background:var(--surface)}
.labrow:first-child{border-top:0}
.labrow label{font-size:15px;font-weight:500}
.labrow input{min-height:40px!important;padding:6px 10px!important}

/* ---------- sites ---------- */
.sites-grid{display:grid;gap:24px}
@media (min-width:980px){.sites-grid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start}}
.bodymap{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:420px;margin:0 auto}
.bodymap.compact{max-width:300px}
.bodymap.single{grid-template-columns:1fr;max-width:240px}
.bodymap figure{margin:0;text-align:center}
.bodymap svg{width:100%;height:auto;display:block;overflow:visible}
.bodymap figcaption{font-size:13px;color:var(--muted);margin-top:2px}
.fig>*{fill:var(--figure)}
.fig-line{stroke:var(--figure-line);stroke-width:1.6;fill:none;stroke-linecap:round}
.lr{font:600 13px var(--font);fill:var(--muted)}
.site{cursor:pointer;outline:none}
.site .hit{fill:transparent}
.site .ring{fill:none;stroke:none;stroke-width:2.5}
.site .dot-c{fill:var(--surface);stroke:var(--accent);stroke-width:2.6}
.site.mid .dot-c{fill:var(--amber);stroke:var(--amber)}
.site.recent .dot-c{fill:var(--warn);stroke:var(--warn)}
.site.sug .ring{stroke:var(--accent);stroke-dasharray:4 3}
.site.sel .ring{stroke:var(--ink);stroke-dasharray:none}
.site:focus-visible .ring{stroke:var(--accent);stroke-dasharray:none}
.site.dim,.site.off{opacity:.3}
.place-pin{fill:var(--ink)}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 16px;font-size:13px;color:var(--muted);margin-top:10px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:12px;height:12px;border-radius:50%}
.legend .l-rest{background:var(--surface);box-shadow:inset 0 0 0 2.5px var(--accent)}
.legend .l-mid{background:var(--amber)}
.legend .l-recent{background:var(--warn)}
.legend .l-sug{width:14px;height:14px;background:transparent;border:2px dashed var(--accent)}
.sitelist .tog{display:inline-flex;align-items:center;gap:8px;font-size:14px;color:var(--ink-2);cursor:pointer;white-space:nowrap}
.sitelist .tog input{width:20px;height:20px;accent-color:var(--accent)}
.sdot{flex:none;width:14px;height:14px;border-radius:50%;background:var(--surface);box-shadow:inset 0 0 0 2.5px var(--accent)}
.sdot.mid{background:var(--amber);box-shadow:none}
.sdot.recent{background:var(--warn);box-shadow:none}

/* ---------- more ---------- */
.group-h{font:600 14px var(--font);color:var(--muted);margin:26px 0 8px 4px}
.group-h:first-of-type{margin-top:6px}
.menu{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.menu>li+li{border-top:1px solid var(--line-2)}
.menu-row{display:flex;align-items:center;gap:14px;width:100%;padding:14px 16px;background:none;border:0;text-align:left;cursor:pointer;color:inherit;text-decoration:none;font:inherit;border-radius:var(--r)}
.menu-row:hover{background:var(--surface-2)}
.mi{width:38px;height:38px;border-radius:11px;background:var(--surface-2);display:grid;place-items:center;color:var(--ink-2);flex:none}
.menu-row b{display:block;font-weight:600}
.menu-row small{display:block;color:var(--muted);font-size:14px}
.menu-row .chev{margin-left:auto;color:var(--muted);flex:none}
.pref{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;flex-wrap:wrap}
.pref input[type=text]{max-width:220px}
.calc-grid{display:grid;gap:14px;max-width:760px}
.calc-grid .sec{margin-top:0}
.result{padding:14px;border-radius:12px;background:var(--surface-2)}
.result p+p{margin-top:4px}
.result .bigr{font:600 24px/1.2 var(--font-c)}
.result .viz{margin-top:10px}
.conv{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:10px;align-items:end;margin-bottom:6px}
.conv .eq{padding-bottom:12px;color:var(--muted);font-weight:600}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:6px;margin:0 0 18px;border:0;padding:0;min-width:0}
.field>span,.field>legend{font-size:15px;font-weight:600;color:var(--ink-2);padding:0;margin-bottom:6px}
.field>span{margin-bottom:0}
.field small{color:var(--muted);font-size:13.5px;font-weight:400}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=datetime-local],input[type=time],select,textarea{width:100%;min-height:48px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;background:var(--surface);font-size:16px;-webkit-appearance:none;appearance:none}
select{background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 50%,calc(100% - 13px) 50%;background-size:5px 5px;background-repeat:no-repeat;padding-right:34px}
textarea{min-height:84px;resize:vertical;line-height:1.45}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field.invalid input,.field.invalid select{border-color:var(--warn)}
.err{color:var(--warn);font-size:14px;font-weight:500}
.row2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
@media (max-width:480px){.row2.stack-sm{grid-template-columns:1fr;gap:0}}
.suffix{position:relative}
.suffix input{padding-right:100px}
.suffix>span{position:absolute;right:14px;top:50%;transform:translateY(-50%);color:var(--muted);font-size:15px;pointer-events:none;white-space:nowrap}
.big-input{font:600 32px/1 var(--font-c)!important;min-height:66px!important;padding:8px 16px!important}
.suffix .big-input{padding-right:110px!important}
.suffix .big-input+span{font-size:18px}
.panel{padding:12px 14px;border-radius:12px;background:var(--surface-2);margin:-6px 0 18px}
.panel p{margin:0}
.panel .viz{margin-top:6px;max-width:340px}
details.more{margin:4px 0 18px;border:1px solid var(--line);border-radius:12px;padding:0 14px}
details.more>summary{cursor:pointer;padding:14px 0;font-weight:600;font-size:15px;color:var(--ink-2)}
details.more[open]{padding-bottom:4px}
.swatches{display:flex;gap:12px;flex-wrap:wrap}
.swatches button{width:38px;height:38px;border-radius:50%;border:0;padding:0;cursor:pointer;background:radial-gradient(circle,color-mix(in srgb,var(--cap) 50%,var(--surface)) 0 30%,var(--cap) 34%);box-shadow:0 0 0 1px color-mix(in srgb,var(--cap) 70%,#000)}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 3px var(--surface),0 0 0 5px var(--ink)}
.time-row{display:flex;gap:6px;align-items:center;margin-bottom:8px;max-width:260px}
.tstep-row{display:grid;grid-template-columns:20px minmax(0,1fr) minmax(0,1fr) 36px;gap:8px;align-items:center;margin-bottom:8px}
.switch{display:inline-flex;align-items:center;gap:12px;cursor:pointer;font-weight:500;position:relative}
.switch input{position:absolute;opacity:0;width:1px;height:1px}
.switch .track{flex:none;width:46px;height:28px;border-radius:14px;background:var(--line);position:relative;transition:background .15s}
.switch .track::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.25);transition:transform .15s}
.switch input:checked+.track{background:var(--accent)}
.switch input:checked+.track::after{transform:translateX(18px)}
.switch input:focus-visible+.track{outline:2px solid var(--accent);outline-offset:2px}
.stepper{display:inline-flex;align-items:center;gap:8px}
.stepper button{width:46px;height:46px;border-radius:23px;border:1px solid var(--line);background:var(--surface);font-size:22px;line-height:1;cursor:pointer;color:var(--ink)}
.stepper input{width:76px;text-align:center;font-weight:600;font-size:20px}
/* wizard */
.wiz-prog{height:4px;background:var(--line-2);border-radius:2px;margin:0 0 20px;overflow:hidden}
.wiz-prog i{display:block;height:100%;background:var(--accent);border-radius:2px}
.opts{display:grid;gap:10px}
.opt{display:flex;align-items:center;gap:14px;width:100%;padding:16px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);text-align:left;cursor:pointer;color:inherit;font:inherit}
.opt:hover{border-color:var(--ink-2)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.opt b{display:block;font-size:16.5px;font-weight:600}
.opt span.d{display:block;font-size:14px;color:var(--muted)}
.opt svg{color:var(--muted);flex:none}
.opt.compact{padding:13px 16px}
.opt.create{border-style:dashed;border-color:var(--accent);color:var(--accent)}
.opt.create b{color:var(--accent)}
.pick-h{font:600 14px var(--font);color:var(--muted);margin:18px 0 8px}
.ctx{display:flex;flex-wrap:wrap;gap:6px;align-items:baseline;margin-bottom:16px;color:var(--ink-2)}
.done-mark{width:64px;height:64px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;margin:6px 0 16px}
.extra{display:flex;align-items:center;gap:14px;padding:14px 16px;border:1px solid var(--line);border-radius:14px;margin-top:10px}
.extra.done{background:var(--surface-2)}
.extra .ok{color:var(--accent)}

/* ---------- sheet ---------- */
#sheet-root{position:fixed;inset:0;z-index:50;display:none}
#sheet-root.open{display:block}
.backdrop{position:absolute;inset:0;background:rgba(8,14,12,.5);animation:fade .18s ease}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:94vh;max-height:94dvh;display:flex;flex-direction:column;background:var(--surface);border-radius:22px 22px 0 0;box-shadow:var(--shadow);animation:up .24s cubic-bezier(.2,.8,.2,1);outline:none}
@media (min-width:700px){
  .sheet{left:50%;right:auto;bottom:auto;top:50%;width:min(560px,calc(100vw - 48px));max-height:min(860px,calc(100dvh - 48px));transform:translate(-50%,-50%);border-radius:22px;animation:pop .2s ease}
  .sheet.narrow{width:min(440px,calc(100vw - 48px))}
}
.sheet-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:16px 14px 12px 20px}
.sheet-head h2{font:600 22px/1.2 var(--font-c)}
.sh-title{display:flex;align-items:center;gap:12px;min-width:0}
.sh-title .icon-btn{margin-left:-10px}
.sheet-body{padding:6px 20px 20px;overflow:auto;-webkit-overflow-scrolling:touch;flex:1;overscroll-behavior:contain}
.sheet-foot{display:flex;gap:10px;justify-content:flex-end;align-items:center;flex-wrap:wrap;padding:12px 20px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line-2)}
.sheet-foot .spacer{flex:1}
.sheet-foot .btn.primary{min-width:120px}
@keyframes up{from{transform:translateY(28px);opacity:0}}
@keyframes pop{from{opacity:0;transform:translate(-50%,-47%)}}
@keyframes fade{from{opacity:0}}

/* ---------- toast ---------- */
#toast-root{position:fixed;left:0;right:0;bottom:calc(80px + env(safe-area-inset-bottom));display:flex;justify-content:center;pointer-events:none;z-index:60;padding:0 16px}
@media (min-width:900px){#toast-root{bottom:28px;left:232px}}
.toast{pointer-events:auto;display:flex;align-items:center;gap:6px;max-width:600px;padding:10px 8px 10px 18px;border-radius:14px;background:var(--ink);color:var(--surface);box-shadow:var(--shadow);animation:up .2s ease;font-weight:500}
.toast span{margin-right:6px}
.toast button{background:none;border:0;color:var(--toast-action);font-weight:700;cursor:pointer;padding:8px 10px;border-radius:8px;white-space:nowrap}

/* ---------- viz ---------- */
.gauge{width:100%;max-width:440px;height:auto;display:block}
.gauge .barrel-bg{fill:var(--surface)}
.gauge .barrel{fill:none;stroke:var(--ink-2);stroke-width:1.5}
.gauge .liquid{fill:var(--cap);opacity:.9}
.gauge .stopper{fill:var(--ink)}
.gauge .rod{fill:var(--muted)}
.gauge .flange{fill:var(--ink-2)}
.gauge .hub{fill:var(--figure-line)}
.gauge .needle{stroke:var(--muted);stroke-width:1.5}
.gauge .tick{stroke:var(--ink-2);stroke-width:1}
.gauge .tick.major{stroke-width:1.6}
.gauge .mark{fill:var(--ink)}
.gauge text{font:500 11px var(--font);fill:var(--muted)}
.tabs-viz{display:flex;gap:6px;flex-wrap:wrap}
.tabs-viz svg{display:block}
.tabs-viz .pill{fill:var(--cap)}
.tabs-viz .ghost{fill:none;stroke:var(--line);stroke-width:1.5;stroke-dasharray:3 2}
.tabs-viz .score{stroke:color-mix(in srgb,var(--cap) 55%,#000);stroke-width:1.5}

/* ---------- welcome ---------- */
.welcome{max-width:620px;margin:3vh auto 0}
.welcome h1{font-size:clamp(34px,6vw,50px);margin-top:22px}
.lede{font-size:18px;color:var(--ink-2);margin:14px 0 26px;max-width:52ch}
.welcome-actions{display:flex;flex-wrap:wrap;gap:10px}
.steps{list-style:none;counter-reset:s;padding:0;margin:40px 0 0;display:grid;gap:18px;border-top:1px solid var(--line);padding-top:26px}
.steps li{counter-increment:s;display:grid;grid-template-columns:34px 1fr;gap:14px}
.steps li::before{content:counter(s);width:30px;height:30px;border-radius:50%;display:grid;place-items:center;border:1.5px solid var(--line);font-weight:600;font-size:14px;color:var(--ink-2)}
.steps p{color:var(--muted);margin-top:2px}

@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
@media print{.rail,.topbar,.tabbar,.fab,#toast-root{display:none!important}main{padding:0}}
</style>
</head>
<body>
<noscript><p style="padding:24px">PinLog needs JavaScript turned on.</p></noscript>
<div class="app">
  <aside class="rail" id="rail"></aside>
  <header class="topbar" id="topbar"></header>
  <main id="view" tabindex="-1"></main>
  <nav class="tabbar" id="tabbar" aria-label="Main"></nav>
  <button class="fab" type="button" data-act="log" id="fab"></button>
</div>
<div id="sheet-root"></div>
<div id="toast-root" aria-live="polite"></div>
<input type="file" id="import-file" accept="application/json,.json" hidden>

<script>
(() => {
'use strict';

/* ================= basics ================= */
const KEY = 'pinlog.v1';
const DAY = 86400000, HOUR = 3600000;
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid = () => Math.random().toString(36).slice(2, 9) + Date.now().toString(36).slice(-5);
const pad = n => String(n).padStart(2, '0');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const sod = d => { d = new Date(d); d.setHours(0, 0, 0, 0); return d; };
const addDays = (d, n) => { d = new Date(d); d.setDate(d.getDate() + n); return d; };

let lastFocus = null, confirmRes = null, FORM = null;
function openSheet(html, { narrow = false } = {}) {

  else lastFocus = document.activeElement;
  $('#toast-root').innerHTML = ''; clearTimeout(toastTimer);
  root.innerHTML = `<div class="backdrop" data-act="sheet-close"></div><div class="sheet${narrow ? ' narrow' : ''}" role="dialog" aria-modal="true" tabindex="-1">${html}</div>`;
  root.classList.add('open');

}
function setSheet(html) {

function openForm(st, renderFn, opts = {}) { FORM = { st, render: renderFn, ...opts }; openSheet(renderFn(st), opts); }

/* ----- logging core ----- */
function makeLog({ c, sid, dose, ts, site, status = 'taken', pain = '', notes = '', vid = null }) {
  const taken = status === 'taken';
  const a = taken ? amounts(c, dose, vid ? vialById(vid) : null) : {};
  const use = taken ? deduct(c, +dose, vid) : [];
  const l = { id: uid(), cid: c.id, sid: sid || null, ts, status, dose: +dose, unit: c.unit, ml: a.ml ?? null, tabs: a.tabs ?? null, site: taken && siteRoute(c) ? site : null, pain, notes, name: c.name, use };
  S.logs.push(l); return l;
}
function removeLog(l, reopen) { S.logs = S.logs.filter(x => x.id !== l.id); restore(l.use, reopen); }
function quickLog(it) {
  if (!it) return;
  const c = it.c;
  if (!S.settings.quickLog) { openLog(c.id, null, { sid: it.s.id, dose: it.dose.dose }); return; }
  const r = siteRoute(c), site = r ? suggestSite(r) : null;
  const l = makeLog({ c, sid: it.s.id, dose: it.dose.dose, ts: Date.now(), site });
  save(); render(); askPersist();
  toast(`Logged ${c.name}${site ? `, ${siteLabel(site).toLowerCase()}` : ''}`, { actions: [
    { label: 'Change', fn: () => openLog(null, l.id) },
    { label: 'Undo', fn: () => { removeLog(l, true); save(); render(); toast('Removed'); } }
  ] });
}
function skipItem(it) {
  if (!it) return;
  const l = makeLog({ c: it.c, sid: it.s.id, dose: it.dose.dose, ts: Date.now(), status: 'skipped' });
  save(); render();
  toast(`Skipped ${it.c.name}`, { actions: [{ label: 'Undo', fn: () => { removeLog(l, false); save(); render(); } }] });
}

function saveLog() {

  if (isNaN(ts)) { st._more = true; rerenderForm(); return fieldError('f-when', 'Pick the date and time.'); }

    const l = S.logs.find(x => x.id === st.id); if (!l) return closeSheet();
    if (l.status === 'skipped') { Object.assign(l, { ts, notes: (st.notes || '').trim() }); save(); closeSheet(); render(); toast('Saved'); return; }

  const exact = PRESETS.some(p => p.name.toLowerCase() === ql) || have.has(ql);
  const mine = ql ? S.compounds.filter(c => c.name.toLowerCase().includes(ql)) : [];

  if (q && !exact) h += `<div class="opts"><button type="button" class="opt create" data-act="w-custom">${ico('plus', 22)}<span class="row-main"><b>Add “${esc(q)}”</b><span class="d">Create your own</span></span></button></div>`;
  if (mine.length) h += `<p class="pick-h">Already added</p><div class="opts">${mine.map(c => `<a class="opt compact" href="#med/${c.id}"><span class="cap" style="--cap:${cv(c)}"></span><span class="row-main"><b>${esc(c.name)}</b><span class="d">Open it</span></span>${ico('next', 20)}</a>`).join('')}</div>`;

function download(name, text, type) {

  const a = document.createElement('a'); a.href = url; a.download = name; a.rel = 'noopener';
  document.body.appendChild(a); a.click();
  setTimeout(() => { URL.revokeObjectURL(url); a.remove(); }, 1000);
}
function exportBackup() {

  S.meta.lastBackup = Date.now(); save(); render();
  toast('Backup downloaded. Keep a copy somewhere safe, like your email or Drive.');
}
async function importBackup(file) {
  let obj;
  try { obj = JSON.parse(await file.text()); } catch (e) { toast("That file isn't a PinLog backup."); return; }
  const data = obj && obj.data ? obj.data : obj;
  if (!data || !Array.isArray(data.compounds) || !Array.isArray(data.logs)) { toast("That file isn't a PinLog backup."); return; }
  const when = obj.exported ? ` from ${fmtDate(obj.exported)}` : '';
  const ok = await confirmBox({ title: 'Restore this backup?', body: `The backup${esc(when)} has ${plural(data.compounds.length, 'compound')} and ${plural(data.logs.length, 'entry', 'entries')}. It replaces everything currently on this device.`, ok: 'Restore backup' });
  if (!ok) return;
  S = normalize(data); save(); location.hash = '#today'; render(); toast('Backup restored');
}
const csvCell = v => { v = String(v ?? ''); if (/^[=+\-@\t]/.test(v)) v = "'" + v; return /[",\r\n]/.test(v) ? `"${v.replace(/"/g, '""')}"` : v; };
function exportCSV() {
  if (!S.logs.length) { toast('Nothing logged yet.'); return; }
  const rows = [['date', 'time', 'compound', 'status', 'dose', 'unit', 'volume_ml', 'route', 'site', 'pain', 'notes']];
  S.logs.slice().sort((a, b) => a.ts - b.ts).forEach(l => { const c = comp(l.cid), d = new Date(l.ts); rows.push([dayKey(d), `${pad(d.getHours())}:${pad(d.getMinutes())}`, logName(l), l.status || 'taken', l.dose, UNIT[l.unit] || l.unit, l.ml != null ? (+l.ml).toFixed(3) : '', c ? ROUTE_SHORT[c.route] : '', l.site ? siteLabel(l.site) : '', l.pain || '', l.notes || '']); });
  download(`pinlog-history-${dayKey(new Date())}.csv`, '\ufeff' + rows.map(r => r.map(csvCell).join(',')).join('\r\n'), 'text/csv');
}
const icsEsc = s => String(s).replace(/\\/g, '\\\\').replace(/;/g, '\\;').replace(/,/g, '\\,').replace(/\r?\n/g, '\\n');
function icsFold(line) { const out = []; while (line.length > 74) { out.push(line.slice(0, 74)); line = ' ' + line.slice(74); } out.push(line); return out.join('\r\n'); }
function exportICS() {
  const today = sod(new Date()), end = addDays(today, 84), ev = [];
  S.schedules.forEach(s => { const c = comp(s.cid); if (c) occ(s, today, end).forEach(o => ev.push({ c, o })); });
  if (!ev.length) { toast('Nothing scheduled yet.'); return; }
  const z = d => `${d.getUTCFullYear()}${pad(d.getUTCMonth() + 1)}${pad(d.getUTCDate())}T${pad(d.getUTCHours())}${pad(d.getUTCMinutes())}00Z`;
  const loc = d => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
  const url = /^https?:/.test(location.protocol) ? location.href.split('#')[0] : '';
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//PinLog//Dose reminders//EN', 'CALSCALE:GREGORIAN', 'METHOD:PUBLISH', 'X-WR-CALNAME:PinLog doses'];
  ev.forEach(({ c, o }) => {
    const st = atTime(o.day, o.time), en = new Date(st.getTime() + 15 * 60000);
    lines.push('BEGIN:VEVENT', `UID:${c.id}-${o.k}-${o.time.replace(':', '')}@pinlog`, `DTSTAMP:${z(new Date())}`, `DTSTART:${loc(st)}`, `DTEND:${loc(en)}`,
      icsFold(`SUMMARY:${icsEsc(`${c.name} ${fmtNum(o.dose)} ${unitLabel(c)}`)}`),
      icsFold(`DESCRIPTION:${icsEsc(`Log it in PinLog after you take it.${url ? ' ' + url : ''}`)}`));
    if (url) lines.push(icsFold(`URL:${url}`));
    lines.push('BEGIN:VALARM', 'ACTION:DISPLAY', icsFold(`DESCRIPTION:${icsEsc(`Time for ${c.name}`)}`), 'TRIGGER:PT0M', 'END:VALARM', 'END:VEVENT');

  lines.push('END:VCALENDAR');
  download('pinlog-reminders.ics', lines.join('\r\n'), 'text/calendar');

}

/* ================= toast ================= */
let toastTimer = null;
function toast(msg, { actions = [], ms = 6000 } = {}) {
  const root = $('#toast-root');
  root.innerHTML = `<div class="toast"><span>${esc(msg)}</span>${actions.map((a, i) => `<button type="button" data-ti="${i}">${esc(a.label)}</button>`).join('')}</div>`;
  $$('button', root).forEach(b => { b.onclick = () => { root.innerHTML = ''; clearTimeout(toastTimer); actions[+b.dataset.ti].fn(); }; });
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { root.innerHTML = ''; }, actions.length ? Math.max(ms, 8000) : ms);
}

document.addEventListener('click', e => {

    if (t.id === 'af-q') { const first = $('#af-list .opt'); if (first) { e.preventDefault(); first.click(); } return; }
    const primary = $('#sheet-root .sheet-foot .btn.primary'); if (primary) { e.preventDefault(); primary.click(); } return;
  }

    const f = $$('#sheet-root .sheet button:not([disabled]), #sheet-root .sheet a[href], #sheet-root .sheet input:not([disabled]), #sheet-root .sheet select:not([disabled]), #sheet-root .sheet textarea, #sheet-root .sheet summary, #sheet-root .sheet [tabindex="0"]').filter(x => x.offsetParent !== null || x.closest('svg'));

    const first = f[0], last = f[f.length - 1];

    else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
  }
